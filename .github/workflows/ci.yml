name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Built here on purpose: tests/e2e spawn `dist/weeek.js` and skip themselves when it is
      # absent. Without this they only ever ran on the one Linux job below, so the parts that
      # are most platform-dependent — path handling, spawning, permissions, stream discipline —
      # were the parts never exercised on macOS or Windows.
      - run: bun run build
      - run: bun run test

  coverage:
    name: coverage gate (src/core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Scoped to src/core, because v8 cannot see into the child processes the rest of the
      # suite spawns — see the comment in vitest.config.ts. Thresholds live there too.
      - run: bun run test:coverage

  changeset:
    name: a user-visible change carries a changeset
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Releases are cut by changesets: a PR that changes shipped behaviour without one is
      # published under no version and appears in no changelog. Docs, tests and CI config are
      # exempt — they change nothing a user installs.
      - name: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          shipped=$(printf '%s\n' "$changed" | grep -E '^(src|spec|scripts)/' | grep -v '\.test\.' || true)
          if [ -z "$shipped" ]; then
            echo "No shipped code changed — no changeset needed."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^\.changeset/.+\.md$'; then
            echo "Changeset present."
            exit 0
          fi
          echo "::error::This PR changes shipped code but adds no changeset. Run \`bunx changeset\` and commit the result, or label the PR if the change is genuinely invisible to users."
          printf 'Shipped files changed:\n%s\n' "$shipped"
          exit 1

  generated:
    # The point of this job is that generated code cannot drift from the spec, or be edited by
    # hand and survive review. It needs a real checkout: with no commits, `git diff` compares
    # nothing and would pass vacuously.
    name: generated code matches the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: codegen produces no diff
        run: |
          bun run gen
          git diff --exit-code -- src/core/api/generated \
            || { echo '::error::Generated code is out of date — run `bun run gen` and commit.'; exit 1; }
      - name: command reference is up to date
        run: bun run scripts/gen-docs.ts --check

  boundary:
    name: core does not import the CLI layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Biome enforces this through noRestrictedImports; the grep is a second, dumber check that
      # keeps working if the lint config is ever loosened by accident.
      - name: grep for forbidden imports
        run: |
          if grep -rnE "from '(\.\./)+(cli|commands|tui)/" src/core; then
            echo '::error::src/core must not import the CLI layer (it is published as weeek-cli/api).'
            exit 1
          fi

  build:
    name: build · smoke · cold start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: end-to-end tests against the built CLI
        # tests/e2e skips itself when dist/ is absent, so it only runs meaningfully here.
        run: bun run test
      - name: runs without credentials
        run: |
          node dist/weeek.js --help > /dev/null
          node dist/weeek.js doctor --json | jq -e '.checks | length > 0'
          test "$(node dist/weeek.js schema --json | jq 'length')" = "153"
      - name: cold start stays under budget
        # 153 commands are easy to make slow: one stray static import of Ink or of every handler
        # in the entry point shows up here and nowhere else.
        run: |
          node dist/weeek.js --help > /dev/null           # warm the page cache
          start=$(date +%s%N)
          for _ in 1 2 3 4 5; do node dist/weeek.js --help > /dev/null; done
          avg=$(( ($(date +%s%N) - start) / 5000000 ))
          echo "average cold start: ${avg} ms"
          test "$avg" -lt 250 || { echo "::error::cold start ${avg} ms exceeds the budget"; exit 1; }

  binaries:
    name: standalone binaries build and stay small
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Until now the six cross-compiled targets were only ever built during a release, so a
      # break in them surfaced at the worst possible moment. Building here costs a minute and
      # moves that discovery to the pull request.
      - run: bun run build:binaries

      # A budget, not a measurement. Each binary embeds the Bun runtime, so the floor is tens of
      # megabytes and creeps upward with Bun itself; what this catches is the other thing — a
      # dependency that pulls in half of npm and doubles what users download.
      - name: sizes stay under budget
        env:
          BUDGET_MB: 130
        run: |
          status=0
          for file in dist/bin/weeek-*; do
            mb=$(( $(wc -c < "$file") / 1048576 ))
            printf '%-32s %4s MB\n' "$(basename "$file")" "$mb"
            if [ "$mb" -gt "$BUDGET_MB" ]; then
              echo "::error file=$file::$(basename "$file") is ${mb} MB, over the ${BUDGET_MB} MB budget"
              status=1
            fi
          done
          exit $status

      - name: the built binary answers
        run: |
          chmod +x dist/bin/weeek-linux-x64
          ./dist/bin/weeek-linux-x64 --help > /dev/null
          test "$(./dist/bin/weeek-linux-x64 schema --json | jq 'length')" = "153"
